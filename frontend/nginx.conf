server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown paths are handled by the client-side router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets (Vite assetsDir = 'static').
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
