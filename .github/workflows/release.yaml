name: Automatic Release from Develop

on:
  workflow_dispatch:

jobs:
  release:
    name: Version Calculation, Merge and Tag
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: ubuntu-latest
    # The job runs ONLY if triggered from the develop branch
    if: github.ref == 'refs/heads/develop'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to fetch all history and compare branches

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Ensure the local master branch is aligned with the remote
          git fetch origin master:master

      - name: Release Process
        run: |
          # 1. Check if the app.version file exists
          if [ ! -f "app.version" ]; then
            echo "ERROR: The app.version file does not exist in the project root."
            exit 1
          fi

          CURRENT_VERSION=$(cat app.version)
          echo "Current version: $CURRENT_VERSION"

          # 2. Parse commits from master to develop
          COMMITS=$(git log master..develop --format="%s")
          
          MAJOR_BUMP=0
          MINOR_BUMP=0

          # Analyze each commit message to determine the bump
          # It supports scopes (e.g., feat(api): or fix(ui)!:)
          while read -r msg; do
            [ -z "$msg" ] && continue
            if echo "$msg" | grep -qE '^(feat|fix)(\([^)]+\))?!:'; then
              MAJOR_BUMP=1
            elif echo "$msg" | grep -qE '^feat(\([^)]+\))?:'; then
              MINOR_BUMP=1
            fi
          done <<< "$COMMITS"

          # Extract version numbers (assumes X.Y.Z format)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          # 3. Calculate the new version
          if [ "$MAJOR_BUMP" -eq 1 ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$MINOR_BUMP" -eq 1 ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            # Default (if all are fixes or no specific tags) increment patch
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "Calculated new version: $NEW_VERSION"

          # 4. Merge develop into master
          git checkout master
          git merge develop --no-ff -m "chore(release): merge develop into master for release $NEW_VERSION"

          # 5. Update the core app.version file
          echo "$NEW_VERSION" > app.version
          git add app.version
          
          # 6. EXECUTE CUSTOM SCRIPT (if it exists)
          if [ -f "./update_versions.sh" ]; then
            echo "Custom script found, running manifest updates..."
            chmod +x ./update_versions.sh
            ./update_versions.sh "$NEW_VERSION"

            # Add files to git only if they exist to prevent workflow failure
            [ -f "backend/pyproject.toml" ] && git add backend/pyproject.toml
            [ -f "frontend/package.json" ] && git add frontend/package.json
          else
            echo "ℹ️ Script ./update_versions.sh not found, skipping."
          fi

          # 7. Commit all the updated version files
          git commit -m "chore(release): bump version to $NEW_VERSION"

          # 8. Create the Tag
          git tag "v$NEW_VERSION"

          # 9. Push master and tag to the remote repository
          git push origin master
          git push origin "v$NEW_VERSION"
          
          # 10. CREATE GITHUB RELEASE
          echo "Creating GitHub Release..."
          gh release create "v$NEW_VERSION" \
            --title "Release v$NEW_VERSION" \
            --generate-notes

          # 11. Merge/Sync master back into develop to maintain the new version
          git checkout develop
          git merge master -m "chore(release): sync master into develop (version $NEW_VERSION)"
          git push origin develop